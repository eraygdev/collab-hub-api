services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: reporeef-backend:latest
    container_name: reporeef-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - reporeef-net

networks:
  reporeef-net:
    driver: bridge